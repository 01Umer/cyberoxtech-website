<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="38" height="38" role="img" aria-label="Cyberox Technologies">
  <title>Cyberox Technologies</title>
  <defs>
    <!-- Dark navy → bright cyan, left-to-right across icon -->
    <linearGradient id="cg" x1="30" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1850C8"/>
      <stop offset="55%" stop-color="#0E9EE0"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <!-- Outer hex-C (largest, widest stroke) -->
  <path d="M193,28 H88 L35,82 V138 L88,192 H193"
        fill="none" stroke="url(#cg)" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Middle hex-C -->
  <path d="M170,50 H103 L57,96 V124 L103,170 H170"
        fill="none" stroke="url(#cg)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner hex-C (narrowest, tips reach brightest cyan zone) -->
  <path d="M148,72 H118 L79,110 L118,148 H148"
        fill="none" stroke="url(#cg)" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- PCB circuit traces from upper-left corner of outer C -->
  <line x1="35" y1="82" x2="10" y2="55" stroke="#1850C8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="10" cy="55" r="7" fill="#1850C8"/>
  <line x1="35" y1="82" x2="7" y2="82" stroke="#1850C8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="7" cy="82" r="5" fill="#1850C8"/>

  <!-- PCB circuit traces from lower-left corner of outer C -->
  <line x1="35" y1="138" x2="10" y2="165" stroke="#1850C8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="10" cy="165" r="7" fill="#1850C8"/>
  <line x1="35" y1="138" x2="7" y2="138" stroke="#1850C8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="7" cy="138" r="5" fill="#1850C8"/>

  <!-- Bright cyan arm-tip nodes (outer C) -->
  <circle cx="193" cy="28" r="10" fill="#00D4FF"/>
  <circle cx="193" cy="192" r="10" fill="#00D4FF"/>

  <!-- Mid-tone arm-tip nodes (middle C) -->
  <circle cx="170" cy="50" r="7" fill="#28C0F0" opacity="0.85"/>
  <circle cx="170" cy="170" r="7" fill="#28C0F0" opacity="0.85"/>
</svg>
